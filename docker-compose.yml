services:
  api:
    build: .
    container_name: ragnarok-api
    ports:
      - "5001:5001"
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_DEBUG: ${FLASK_DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      API_KEY: ${API_KEY:-change-me-api-key}
      BASE_URL: ${BASE_URL:-http://127.0.0.1:5001}
      MONGO_URI: ${MONGO_URI:-mongodb://dbprojeto:3177@mongodb:27021/ragnarok?authSource=admin}
    command: flask --app run run --host 0.0.0.0 --port 5001
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: ragnarok-mongodb
    command: mongod --port 27021
    environment:
      MONGO_INITDB_ROOT_USERNAME: dbprojeto
      MONGO_INITDB_ROOT_PASSWORD: "3177"
    ports:
      - "27021:27021"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
